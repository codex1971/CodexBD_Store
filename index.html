<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexBD Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #000206;
            --card-bg: rgba(3, 8, 20, 0.95);
            --accent-cyan: #00f3ff;
            --accent-blue: #0066ff;
            --accent-red: #ff0055;
            --accent-green: #00ff66;
            --accent-purple: #b000ff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-glow: rgba(0, 243, 255, 0.6);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            pointer-events: none;
            z-index: 0;
        }

        #toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(4, 15, 30, 0.95);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            z-index: 999999;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        #loading-spinner-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 0;
            width: 100%;
            grid-column: 1 / -1;
        }
        .cyber-spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-cyan);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .ripple-target {
            position: relative;
            overflow: hidden;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(3.5); opacity: 0; }
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000206;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #intro-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glitch-box {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 35px;
            background: rgba(2, 6, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid var(--accent-cyan);
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            max-width: 90%;
            width: 400px;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            position: relative;
            animation: glitch-anim 0.8s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 3px 0 var(--accent-red), -3px 0 var(--accent-cyan); transform: translate(0); }
            20% { text-shadow: -3px 0 var(--accent-purple), 3px 0 var(--accent-green); transform: translate(-2px, 2px); }
            40% { text-shadow: 2px -2px var(--accent-cyan), -2px 2px var(--accent-red); transform: translate(2px, -1px); }
            60% { text-shadow: -2px 2px var(--accent-green), 2px -2px var(--accent-purple); transform: translate(-1px, -2px); }
            100% { text-shadow: 3px 0 var(--accent-red), -3px 0 var(--accent-cyan); transform: translate(0); }
        }

        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 2, 6, 0.96);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .auth-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 3px;
            background: linear-gradient(0deg, var(--accent-cyan), var(--accent-purple), var(--accent-blue), var(--accent-cyan));
            background-size: 400% 400%;
            animation: borderRotate 4s linear infinite, popupScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            margin: auto;
            transform: scale(0.6);
            opacity: 0;
        }

        @keyframes popupScale {
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-card {
            background: rgba(4, 9, 22, 0.98);
            width: 100%;
            padding: 35px 30px;
            position: relative;
            clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .auth-header h2 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 12px var(--accent-cyan);
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .holo-input-group {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .holo-input-group input, 
        .holo-input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 243, 255, 0.04);
            border: 1px solid var(--glass-border);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .holo-input-group select option {
            background: #040916;
            color: #fff;
        }

        .holo-input-group input:focus,
        .holo-input-group select:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 243, 255, 0.09);
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
        }

        .holo-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
            transition: all 0.25s ease;
            background: #040916;
            padding: 0 6px;
        }

        .holo-input-group input:focus + .holo-label,
        .holo-input-group input:not(:placeholder-shown) + .holo-label,
        .holo-input-group select:focus + .holo-label,
        .holo-input-group select:valid + .holo-label {
            top: -9px;
            left: 12px;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-shadow: 0 0 8px var(--accent-cyan);
            transform: translateY(0);
        }

        .password-toggle-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 10;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .password-toggle-icon:hover {
            color: var(--accent-cyan);
        }

        .forgot-password-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
            font-size: 0.82rem;
            font-family: 'Share Tech Mono', monospace;
        }
        .forgot-password-link span {
            color: var(--accent-cyan);
            cursor: pointer;
            text-decoration: underline;
        }

        .holo-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: 2px solid #fff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 14px;
            width: 100%;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            transition: all 0.3s ease;
        }

        .holo-btn:hover {
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            box-shadow: 0 0 45px rgba(0, 243, 255, 0.9);
            transform: translateY(-2px);
        }

        .holo-btn:active { transform: scale(0.96); }

        .auth-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-switch span {
            color: var(--accent-cyan);
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Share Tech Mono', monospace;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            display: none;
        }

        .success-msg {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Share Tech Mono', monospace;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            display: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
