<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexBD Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #000206;
            --card-bg: rgba(3, 8, 20, 0.95);
            --accent-cyan: #00f3ff;
            --accent-blue: #0066ff;
            --accent-red: #ff0055;
            --accent-green: #00ff66;
            --accent-purple: #b000ff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-glow: rgba(0, 243, 255, 0.6);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            pointer-events: none;
            z-index: 0;
        }

        #toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(4, 15, 30, 0.95);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            z-index: 999999;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .skeleton-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 330px));
            justify-content: center;
            gap: 25px;
            width: 100%;
            padding: 10px 0 30px 0;
        }

        .skeleton-card {
            width: 320px;
            height: 390px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        .shimmer-line {
            position: relative;
            background: rgba(0, 243, 255, 0.06);
            overflow: hidden;
        }

        .shimmer-line::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(0, 243, 255, 0.15) 20%,
                rgba(0, 243, 255, 0.3) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 1.5s infinite;
            content: '';
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .skeleton-preview {
            width: 100%;
            height: 170px;
            border-bottom: 1px solid var(--glass-border);
        }

        .skeleton-body {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeleton-title {
            height: 20px;
            width: 80%;
            border-radius: 4px;
        }

        .skeleton-meta {
            display: flex;
            justify-content: space-between;
        }

        .skeleton-meta-item {
            height: 14px;
            width: 35%;
            border-radius: 3px;
        }

        .ripple-target {
            position: relative;
            overflow: hidden;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(3.5); opacity: 0; }
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000206;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #intro-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glitch-box {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 35px;
            background: rgba(2, 6, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid var(--accent-cyan);
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            max-width: 90%;
            width: 400px;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            position: relative;
            animation: glitch-anim 0.8s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 3px 0 var(--accent-red), -3px 0 var(--accent-cyan); transform: translate(0); }
            20% { text-shadow: -3px 0 var(--accent-purple), 3px 0 var(--accent-green); transform: translate(-2px, 2px); }
            40% { text-shadow: 2px -2px var(--accent-cyan), -2px 2px var(--accent-red); transform: translate(2px, -1px); }
            60% { text-shadow: -2px 2px var(--accent-green), 2px -2px var(--accent-purple); transform: translate(-1px, -2px); }
            100% { text-shadow: 3px 0 var(--accent-red), -3px 0 var(--accent-cyan); transform: translate(0); }
        }

        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 2, 6, 0.96);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .auth-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 3px;
            background: linear-gradient(0deg, var(--accent-cyan), var(--accent-purple), var(--accent-blue), var(--accent-cyan));
            background-size: 400% 400%;
            animation: borderRotate 4s linear infinite, popupScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            margin: auto;
            transform: scale(0.6);
            opacity: 0;
        }

        @keyframes popupScale {
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-card {
            background: rgba(4, 9, 22, 0.98);
            width: 100%;
            padding: 35px 30px;
            position: relative;
            clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .auth-header h2 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 12px var(--accent-cyan);
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .holo-input-group {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .holo-input-group input, 
        .holo-input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 243, 255, 0.04);
            border: 1px solid var(--glass-border);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .holo-input-group input:focus,
        .holo-input-group select:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 243, 255, 0.09);
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
        }

        .holo-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
            transition: all 0.25s ease;
            background: #040916;
            padding: 0 6px;
        }

        .holo-input-group input:focus + .holo-label,
        .holo-input-group input:not(:placeholder-shown) + .holo-label,
        .holo-input-group select:focus + .holo-label,
        .holo-input-group select:valid + .holo-label {
            top: -9px;
            left: 12px;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-shadow: 0 0 8px var(--accent-cyan);
            transform: translateY(0);
        }

        .password-toggle-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 10;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .password-toggle-icon:hover { color: var(--accent-cyan); }

        .forgot-password-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
            font-size: 0.82rem;
            font-family: 'Share Tech Mono', monospace;
        }
        .forgot-password-link span {
            color: var(--accent-cyan);
            cursor: pointer;
            text-decoration: underline;
        }

        .holo-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: 2px solid #fff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 14px;
            width: 100%;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            transition: all 0.3s ease;
        }

        .holo-btn:hover {
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            box-shadow: 0 0 45px rgba(0, 243, 255, 0.9);
            transform: translateY(-2px);
        }

        .auth-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-switch span {
            color: var(--accent-cyan);
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Share Tech Mono', monospace;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            display: none;
        }

        .success-msg {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Share Tech Mono', monospace;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            display: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: none;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }

        .logo i { color: var(--accent-cyan); }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            font-weight: 700;
            padding: 8px 14px;
            border: none;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-logout {
            background: rgba(255, 0, 85, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            padding: 8px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
        }

        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .floating-input-group {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .floating-input-group input, 
        .floating-input-group textarea,
        .floating-input-group select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .floating-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.88rem;
            pointer-events: none;
            background: #040914;
            padding: 0 4px;
        }

        .search-box-group { margin-bottom: 0; }
        .search-box-group .floating-label { left: 40px; }

        .search-box-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            z-index: 2;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px 2px;
            position: relative;
            z-index: 80;
            width: 100%;
            align-items: center;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            color: var(--text-secondary);
            padding: 8px 14px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
            font-size: 0.8rem;
            flex: 0 0 auto;
            min-width: 80px;
            text-align: center;
        }

        .filter-btn.active {
            background: rgba(0, 243, 255, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .all-files-stack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 330px));
            justify-content: center;
            gap: 25px;
            margin: 0 auto;
            max-width: 100%;
            padding: 10px 0 30px 0;
        }

        .category-section {
            margin-bottom: 35px;
        }

        .category-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            padding-left: 5px;
            border-left: 3px solid var(--accent-cyan);
        }

        .category-scroll-row {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 30px 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) rgba(0,0,0,0.5);
            align-items: center;
            justify-content: flex-start;
        }

        .file-card-wrapper {
            width: 320px;
            height: 390px;
            flex: 0 0 auto;
            perspective: 1000px;
            cursor: pointer;
            margin: 0 auto;
        }

        .file-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: left;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 243, 255, 0.2);
            border-radius: 12px;
        }

        .file-card-wrapper.flipped .file-card-inner {
            transform: rotateY(180deg);
        }

        .file-card-front, .file-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-card-back {
            transform: rotateY(180deg);
            background: rgba(5, 12, 28, 0.98);
            border-color: var(--accent-purple);
            padding: 20px;
            justify-content: space-between;
        }

        .back-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 6px;
        }

        .back-desc {
            font-size: 0.85rem;
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.5;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
        }

        .file-preview {
            width: 100%;
            height: 170px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-glow);
        }

        .card-menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--accent-cyan);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .card-dropdown-menu {
            position: absolute;
            top: 48px;
            right: 10px;
            background: #060c1c;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            width: 150px;
            z-index: 20;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .card-dropdown-menu.open { display: flex; }

        .dropdown-item {
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-family: 'Share Tech Mono', monospace;
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
        }
        .dropdown-item:hover {
            background: rgba(0, 243, 255, 0.15);
            color: var(--accent-cyan);
        }

        .file-icon-large { font-size: 3.2rem; color: var(--accent-cyan); filter: drop-shadow(0 0 10px var(--accent-cyan)); }

        .file-details {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .file-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .file-actions {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--glass-border);
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }
        .action-btn.liked { color: var(--accent-red) !important; }

        .comments-section {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px dashed var(--glass-border);
        }

        .comment-toggle-btn {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .comments-dropdown-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .comments-dropdown-wrapper.open { max-height: 120px; opacity: 1; }

        .comments-list {
            max-height: 50px;
            overflow-y: auto;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
        }

        .comment-item {
            background: rgba(0, 243, 255, 0.05);
            padding: 2px 4px;
            margin-bottom: 2px;
            border-left: 2px solid var(--accent-cyan);
        }

        .comment-input-box { display: flex; gap: 4px; }
        .comment-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 3px 5px;
            font-size: 0.75rem;
            outline: none;
        }
        .comment-submit-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 3px 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* সাইবার ফিউচারিস্টিক কাস্টম পিকার মোডাল স্টাইল */
        .cyber-picker-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 2, 8, 0.9);
            backdrop-filter: blur(10px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 15px;
        }
        .cyber-picker-overlay.active { opacity: 1; visibility: visible; }

        .cyber-picker-card {
            background: #04091c;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            transform: scale(0.7) rotateX(15deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cyber-picker-overlay.active .cyber-picker-card {
            transform: scale(1) rotateX(0deg);
        }

        .cyber-picker-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            font-size: 1.1rem;
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .cyber-options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .cyber-picker-option {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.25s ease;
        }
        .cyber-picker-option:hover {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 4, 10, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            padding: 15px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-card {
            background: #060c1c;
            border: 1px solid var(--border-glow);
            clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
            width: 100%;
            max-width: 460px;
            padding: 22px;
            margin: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h3 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; }

        .dialog-close-btn {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
        }

        footer {
            text-align: center; padding: 15px 0;
            border-top: 1px solid var(--glass-border);
            color: var(--text-secondary); font-size: 0.85rem;
        }
        footer a { color: var(--accent-cyan); text-decoration: none; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div id="toast-notification">Notification Message</div>

    <!-- কাস্টম সাইবার ফিউচারিস্টিক ডেট ও জেন্ডার পিকার মোডাল -->
    <div class="cyber-picker-overlay" id="cyberPickerModal">
        <div class="cyber-picker-card">
            <h3 class="cyber-picker-title" id="cyberPickerTitle">SELECT VALUE</h3>
            <div class="cyber-options-list" id="cyberPickerOptionsList"></div>
            <button type="button" class="holo-btn ripple-target" onclick="closeCyberPicker()" style="margin-top: 18px; padding: 10px; font-size: 0.85rem;">
                CANCEL
            </button>
        </div>
    </div>

    <!-- ফাইল ইনফো মডাল -->
    <div class="modal-overlay" id="fileInfoModal" onclick="preventOutsideClose(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-circle-info" style="color: var(--accent-cyan);"></i> File Information</h3>
                <button class="dialog-close-btn ripple-target" onclick="closeModal('fileInfoModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="fileInfoContentBox" style="font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; line-height: 1.6; color: var(--text-primary); display: flex; flex-direction: column; gap: 10px;">
                <!-- ডাইনামিক ডেটা ইনজেক্ট হবে -->
            </div>
        </div>
    </div>

    <!-- অথেন্টিকেশন স্ক্রিন -->
    <div id="auth-screen">
        <div class="auth-card-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h2 id="authTitle">SECURE LOGIN</h2>
                    <p id="authSubtitle">Authorize Access to CodexBD</p>
                </div>
                
                <div class="error-msg" id="authErrorMsg"></div>
                <div class="success-msg" id="authSuccessMsg"></div>

                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div id="signUpExtraFields" style="display: none;">
                        <div class="holo-input-group">
                            <input type="text" id="authFullName" placeholder=" ">
                            <label class="holo-label" for="authFullName">Full Name</label>
                        </div>
                        <div class="holo-input-group">
                            <input type="text" id="authUsername" placeholder=" ">
                            <label class="holo-label" for="authUsername">Username</label>
                        </div>
                        
                        <!-- কাস্টম সাইবার ফিউচারিস্টিক ডেট পিকার ইনপুট -->
                        <div class="holo-input-group" onclick="openCyberDatePicker()" style="cursor: pointer;">
                            <input type="text" id="authDobDisplay" placeholder=" " readonly style="cursor: pointer;">
                            <label class="holo-label" for="authDobDisplay">Date of Birth</label>
                        </div>
                        <input type="hidden" id="authDob" value="">

                        <!-- কাস্টম সাইবার ফিউচারিস্টিক জেন্ডার পিকার ইনপুট -->
                        <div class="holo-input-group" onclick="openCyberGenderPicker()" style="cursor: pointer;">
                            <input type="text" id="authGenderDisplay" placeholder=" " readonly style="cursor: pointer;">
                            <label class="holo-label" for="authGenderDisplay">Gender</label>
                        </div>
                        <input type="hidden" id="authGender" value="">
                    </div>

                    <div class="holo-input-group">
                        <input type="email" id="authEmail" placeholder=" " required>
                        <label class="holo-label" for="authEmail">Email Address</label>
                    </div>

                    <div class="holo-input-group">
                        <input type="password" id="authPassword" placeholder=" " required>
                        <label class="holo-label" for="authPassword">Password</label>
                        <i class="fa-solid fa-eye password-toggle-icon" id="togglePasswordBtn" onclick="togglePasswordVisibility()"></i>
                    </div>

                    <div class="forgot-password-link" id="forgotPasswordContainer">
                        <span onclick="openForgotPasswordModal()">Forgot Password?</span>
                    </div>
                    
                    <button type="submit" id="authSubmitBtn" class="holo-btn ripple-target" style="margin-top: 5px;">
                        <i class="fa-solid fa-right-to-bracket" id="authBtnIcon"></i> <span id="authBtnText">LOGIN SYSTEM</span>
                    </button>
                </form>

                <div class="auth-switch" id="authSwitchText">
                    New user? <span onclick="toggleAuthMode()">Create Account</span>
                </div>
            </div>
        </div>
    </div>

    <!-- মূল অ্যাপ্লিকেশন কন্টেইনার -->
    <div class="app-container" id="mainAppContainer">
        <header>
            <a href="#" class="logo">
                <i class="fa-solid fa-terminal"></i> CODEXBD STORE
            </a>
            <div class="header-actions">
                <button class="btn-secondary ripple-target" onclick="openModal('profileModal')">
                    <i class="fa-solid fa-user-shield"></i> Profile
                </button>
                <button class="btn-primary ripple-target" onclick="openUploadModalForNew()">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload
                </button>
                <button class="btn-logout ripple-target" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </header>

        <div class="controls-bar">
            <div class="floating-input-group search-box-group">
                <i class="fa-solid fa-magnifying-glass search-box-icon"></i>
                <input type="text" id="searchInput" placeholder=" " onkeyup="filterFiles()" style="padding-left: 40px;">
                <label class="floating-label" for="searchInput">Search files by title...</label>
            </div>
            
            <div class="filter-tabs">
                <button type="button" class="filter-btn ripple-target active" onclick="handleFormatClick('all', this)">All</button>
                <button type="button" class="filter-btn ripple-target" onclick="handleFormatClick('SW', this)">.SW</button>
                <button type="button" class="filter-btn ripple-target" onclick="handleFormatClick('JSON', this)">.JSON</button>
                <button type="button" class="filter-btn ripple-target" onclick="handleFormatClick('APK', this)">.APK</button>
                <button type="button" class="filter-btn ripple-target" onclick="handleFormatClick('MP4', this)">.MP4</button>
            </div>
        </div>

        <div id="fileSectionsContainer">
            <div class="skeleton-wrapper">
                <div class="skeleton-card"><div class="skeleton-preview shimmer-line"></div></div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 CODEXBD STORE. Developed by Khokon Talukdar.</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCyZJsdodRp8ZSNMqzKbSmt1pb_QgW3JkE",
          authDomain: "codexbd-26df0.firebaseapp.com",
          databaseURL: "https://codexbd-26df0-default-rtdb.firebaseio.com",
          projectId: "codexbd-26df0",
          storageBucket: "codexbd-26df0.firebasestorage.app",
          messagingSenderId: "258006837169",
          appId: "1:258006837169:web:7bc2d9303273f9bc593f90"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let isSignUpMode = false;
        let currentUserEmail = "";
        window.filesData = [];

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // কাস্টম সাইবার ফিউচারিস্টিক ডেট ও জেন্ডার পিকার ফাংশন
        window.openCyberDatePicker = function() {
            const modal = document.getElementById('cyberPickerModal');
            const title = document.getElementById('cyberPickerTitle');
            const list = document.getElementById('cyberPickerOptionsList');
            title.innerText = "SELECT DATE OF BIRTH";
            list.innerHTML = '';

            // সাম্প্রতিক এবং পাস্ট ইয়ারের কিছু সুন্দর স্যাম্পল বা ডাইনামিক ডেট জেনারেট করা
            const currentYear = new Date().getFullYear();
            for(let y = currentYear - 10; y >= currentYear - 35; y--) {
                ['01-15', '06-20', '11-05'].forEach(md => {
                    const dateStr = `${y}-${md}`;
                    const opt = document.createElement('div');
                    opt.className = 'cyber-picker-option';
                    opt.innerText = dateStr;
                    opt.onclick = function() {
                        document.getElementById('authDobDisplay').value = dateStr;
                        document.getElementById('authDob').value = dateStr;
                        modal.classList.remove('active');
                    };
                    list.appendChild(opt);
                });
            }
            modal.classList.add('active');
        }

        window.openCyberGenderPicker = function() {
            const modal = document.getElementById('cyberPickerModal');
            const title = document.getElementById('cyberPickerTitle');
            const list = document.getElementById('cyberPickerOptionsList');
            title.innerText = "SELECT GENDER";
            list.innerHTML = '';

            ['Male', 'Female', 'Other'].forEach(gender => {
                const opt = document.createElement('div');
                opt.className = 'cyber-picker-option';
                opt.innerText = gender;
                opt.onclick = function() {
                    document.getElementById('authGenderDisplay').value = gender;
                    document.getElementById('authGender').value = gender;
                    modal.classList.remove('active');
                };
                list.appendChild(opt);
            });
            modal.classList.add('active');
        }

        window.closeCyberPicker = function() {
            document.getElementById('cyberPickerModal').classList.remove('active');
        }

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "SECURE SIGN UP" : "SECURE LOGIN";
            document.getElementById('authSubtitle').innerText = isSignUpMode ? "Create a new user account" : "Authorize Access to CodexBD";
            document.getElementById('authBtnText').innerText = isSignUpMode ? "REGISTER ACCOUNT" : "LOGIN SYSTEM";
            document.getElementById('authBtnIcon').className = isSignUpMode ? "fa-solid fa-user-plus" : "fa-solid fa-right-to-bracket";
            document.getElementById('signUpExtraFields').style.display = isSignUpMode ? "block" : "none";
            document.getElementById('forgotPasswordContainer').style.display = isSignUpMode ? "none" : "block";
            document.getElementById('authSwitchText').innerHTML = isSignUpMode ? 
                'Already have an ID? <span onclick="toggleAuthMode()">Login System</span>' : 
                'New user? <span onclick="toggleAuthMode()">Create Account</span>';
        }

        window.handleAuthSubmit = async function(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorEl = document.getElementById('authErrorMsg');
            errorEl.style.display = 'none';

            try {
                if (isSignUpMode) {
                    const fullName = document.getElementById('authFullName').value;
                    const username = document.getElementById('authUsername').value;
                    const dob = document.getElementById('authDob').value;
                    const gender = document.getElementById('authGender').value;

                    await createUserWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('codexbd_user_name_' + email, fullName);
                    localStorage.setItem('codexbd_user_username_' + email, username);
                    
                    showToast("Account created successfully!");
                    setTimeout(() => { toggleAuthMode(); }, 1200);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast("Login Successful!");
                }
            } catch (error) {
                errorEl.style.display = 'block';
                errorEl.innerText = error.message;
            }
        }

        window.handleLogout = function() {
            signOut(auth).then(() => {
                document.getElementById('mainAppContainer').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
                showToast("Logged out successfully.");
            });
        }

        function fetchFirebaseFiles() {
            const filesRef = ref(db, '/');
            onValue(filesRef, (snapshot) => {
                const data = snapshot.val();
                window.filesData = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        if (item && item.title) {
                            window.filesData.push({
                                id: key,
                                title: item.title || "Untitled",
                                description: item.description || "No description provided.",
                                category: item.category || "code",
                                format: (item.format || "SW").toUpperCase(),
                                fileSize: item.fileSize || "2.4 MB",
                                duration: item.duration || "N/A",
                                uploadDate: item.uploadDate || new Date().toISOString().split('T')[0],
                                fileUrl: item.fileUrl || "#",
                                uploaderEmail: item.uploaderEmail || "",
                                likes: item.likes || 0,
                                likedUsers: item.likedUsers || {},
                                comments: item.comments || []
                            });
                        }
                    });
                }
                window.filesData.reverse();
                renderFiles();
            });
        }

        // থ্রি-ডট মেনুতে ফাইল ইনফো দেখার ফাংশন
        window.openFileInfoModal = function(id, event) {
            event.stopPropagation();
            const file = window.filesData.find(x => x.id === id);
            if (!file) return;

            const box = document.getElementById('fileInfoContentBox');
            box.innerHTML = `
                <div><b style="color: var(--accent-cyan);">Title:</b> ${file.title}</div>
                <div><b style="color: var(--accent-cyan);">Format:</b> .${file.format}</div>
                <div><b style="color: var(--accent-cyan);">File Size:</b> ${file.fileSize}</div>
                <div><b style="color: var(--accent-cyan);">Duration:</b> ${file.duration || 'N/A'}</div>
                <div><b style="color: var(--accent-cyan);">Upload Date:</b> ${file.uploadDate}</div>
                <div><b style="color: var(--accent-cyan);">Description:</b><br><span style="color: var(--text-secondary);">${file.description}</span></div>
            `;
            openModal('fileInfoModal');
            document.querySelectorAll('.card-dropdown-menu').forEach(el => el.classList.remove('open'));
        }

        window.toggleCardMenu = function(id, event) {
            event.stopPropagation();
            document.querySelectorAll('.card-dropdown-menu').forEach(el => {
                if (el.id !== `card-menu-${id}`) el.classList.remove('open');
            });
            const menu = document.getElementById(`card-menu-${id}`);
            if (menu) menu.classList.toggle('open');
        }

        document.addEventListener('click', function() {
            document.querySelectorAll('.card-dropdown-menu').forEach(el => el.classList.remove('open'));
        });

        window.toggleCardFlip = function(cardWrapper) {
            cardWrapper.classList.toggle('flipped');
        }

        window.renderFiles = function() {
            const container = document.getElementById('fileSectionsContainer');
            if (!container) return;

            container.innerHTML = '';
            const stackContainer = document.createElement('div');
            stackContainer.className = 'all-files-stack';

            window.filesData.forEach(file => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'file-card-wrapper';
                cardWrapper.onclick = function(e) {
                    if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) return;
                    window.toggleCardFlip(this);
                };

                cardWrapper.innerHTML = `
                    <div class="file-card-inner">
                        <div class="file-card-front">
                            <div class="file-preview">
                                <i class="fa-solid fa-file-code file-icon-large"></i>
                                <button class="card-menu-btn" onclick="toggleCardMenu('${file.id}', event)">
                                    <i class="fa-solid fa-ellipsis-vertical"></i>
                                </button>
                                <div class="card-dropdown-menu" id="card-menu-${file.id}">
                                    <button class="dropdown-item" onclick="openFileInfoModal('${file.id}', event)">
                                        <i class="fa-solid fa-circle-info"></i> File Info
                                    </button>
                                    <button class="dropdown-item" onclick="sharePost('${file.title}', event)">
                                        <i class="fa-solid fa-share-nodes"></i> Share
                                    </button>
                                    <a href="${file.fileUrl}" download="${file.title}.${file.format.toLowerCase()}" class="dropdown-item">
                                        <i class="fa-solid fa-download"></i> Download
                                    </a>
                                </div>
                            </div>
                            <div class="file-details">
                                <div class="file-title">${file.title}</div>
                                <div class="file-meta">
                                    <span style="color: var(--accent-cyan); font-weight: bold;">.${file.format} (${file.fileSize})</span>
                                    <span>${file.uploadDate}</span>
                                </div>
                                <div class="file-actions">
                                    <button class="action-btn" onclick="toggleLike('${file.id}')">
                                        <i class="fa-solid fa-heart"></i> <span>${file.likes || 0}</span>
                                    </button>
                                    <span style="font-size: 0.75rem; color: var(--text-secondary); font-family: 'Share Tech Mono', monospace;">Tap card for desc</span>
                                </div>
                            </div>
                        </div>
                        <div class="file-card-back">
                            <div>
                                <div class="back-title"><i class="fa-solid fa-circle-info"></i> DESCRIPTION</div>
                                <div class="back-desc">${file.description}</div>
                            </div>
                            <div style="text-align: center; font-size: 0.78rem; color: var(--accent-cyan); font-family: 'Share Tech Mono', monospace;">
                                Tap card to flip back ⟲
                            </div>
                        </div>
                    </div>
                `;
                stackContainer.appendChild(cardWrapper);
            });
            container.appendChild(stackContainer);
        }

        window.openModal = function(id) { document.getElementById(id).classList.add('active'); }
        window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('mainAppContainer').style.display = 'block';
                fetchFirebaseFiles();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('mainAppContainer').style.display = 'none';
            }
        });
    </script>
</body>
    </html>
